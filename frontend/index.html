<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Centro Anxur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }
        
        #callbacks-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .callback-item {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .callback-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .callback-item strong {
            color: #333;
            font-size: 16px;
        }
        
        .callback-item a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .callback-item a:hover {
            text-decoration: underline;
        }
        
        .callback-item small {
            color: #999;
            display: block;
            margin-top: 10px;
        }
        
        .callback-item p {
            margin: 5px 0;
            color: #555;
        }
        
        .refresh-info {
            text-align: center;
            color: #999;
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Callback in Sospeso</h1>
        <div id="callbacks-list">
            <p>Caricamento...</p>
        </div>
        <div class="refresh-info">
            ⟳ Aggiornamento ogni 5 secondi
        </div>
    </div>

    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
        google.charts.load('current', {'packages':['corechart']});
    </script>
    <script src="script.js"></script>
</body>
</html>
