<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Anxur - Dashboard Operatrici</title>
    <link rel="stylesheet" href="style.css">
    <style>
#tabs {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    border-bottom: 2px solid #ddd;
}

#tabs button {
    padding: 10px 20px;
    background: #f0f0f0;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

#tabs button:hover {
    background: #e0e0e0;
}

.tab-content {
    padding: 20px 0;
}

.callback-item {
    background: #f9f9f9;
    padding: 15px;
    margin: 10px 0;
    border-left: 4px solid #4CAF50;
    border-radius: 4px;
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📞 Centro Analisi Anxur - Dashboard Operatrici</h1>
            <div class="status">
                <span id="status-badge" class="badge badge-online">● Online</span>
                <span id="time-display" class="time"></span>
            </div>
        </header>

        <main>
            <div id="tabs">
                <button onclick="showTab('callbacks')">📞 Callback in Sospeso</button>
                <button onclick="showTab('prenotazioni')">📅 Prenotazioni</button>
                <button onclick="showTab('completati')">✅ Storico Richiamate</button>
            </div>

            <div id="callbacks-tab" class="tab-content">
                <h2>Callback in Sospeso</h2>
                <div id="callbacks-list"></div>
            </div>

            <div id="prenotazioni-tab" class="tab-content" style="display:none;">
                <h2>Prenotazioni Odierne</h2>
                <div id="prenotazioni-list"></div>
            </div>

            <div id="completati-tab" class="tab-content" style="display:none;">
                <h2>Storico Richiamate Oggi</h2>
                <div id="completati-list"></div>
            </div>
        </main>

        <footer>
            <p>Centro Analisi Anxur © 2026 | Voicebot Tc sistem Demo</p>
        </footer>
    </div>

    <!-- MODAL: Callback Completato -->
    <div id="modal-callback" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>✅ Callback Completato</h3>
            <form id="form-callback">
                <div class="form-group">
                    <label>Cliente:</label>
                    <p id="modal-cliente-nome" class="form-value"></p>
                </div>
                <div class="form-group">
                    <label>Telefono:</label>
                    <p id="modal-cliente-telefono" class="form-value"></p>
                </div>
                <div class="form-group">
                    <label>Note (opzionale):</label>
                    <textarea id="modal-note" placeholder="Es: Prenotato per lunedì 9:30"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salva e Completa</button>
                    <button type="button" class="btn btn-secondary modal-close-btn">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Nuovo Callback Test -->
    <div id="modal-test-callback" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>🧪 Test Callback (Simulazione Voicebot)</h3>
            <form id="form-test-callback">
                <div class="form-group">
                    <label>Nome Cliente:</label>
                    <input type="text" id="test-nome" name="nome" placeholder="Es: Mario" required>
                </div>
                <div class="form-group">
                    <label>Cognome:</label>
                    <input type="text" id="test-cognome" name="cognome" placeholder="Es: Rossi" required>
                </div>
                <div class="form-group">
                    <label>Telefono:</label>
                    <input type="tel" id="test-telefono" name="telefono" placeholder="Es: +39 333 1234567" required>
                </div>
                <div class="form-group">
                    <label>Tipo Analisi:</label>
                    <select id="test-analisi" name="analisi" required>
                        <option value="">-- Seleziona --</option>
                        <option value="Ematologia">Ematologia</option>
                        <option value="Biochmica">Biochmica</option>
                        <option value="Sierologia">Sierologia</option>
                        <option value="Immunologia">Immunologia</option>
                        <option value="Coagulazione">Coagulazione</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Orario Preferito:</label>
                    <select id="test-orario" name="orario">
                        <option value="qualsiasi">Qualsiasi</option>
                        <option value="mattina">Mattina (9-13)</option>
                        <option value="pomeriggio">Pomeriggio (14-18)</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Crea Callback</button>
                    <button type="button" class="btn btn-secondary modal-close-btn">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <button id="test-callback-btn" class="btn-floating">🧪 Test</button>

    <script src="script.js?v=3"></script>
    <script>
function showTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.getElementById(tabName + '-tab').style.display = 'block';
    
    if (tabName === 'completati') {
        loadCompletati();
    }
}
    </script>
</body>
</html>
